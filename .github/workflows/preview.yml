name: Preview

on:
  pull_request:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  database-dev:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_DEV }}
      - run: pnpm exec supabase db push

  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec opennextjs-cloudflare build
      # Versões de preview exigem que o Worker já exista; no primeiro PR ele é criado aqui.
      - run: pnpm exec wrangler deployments list > /dev/null 2>&1 || pnpm exec opennextjs-cloudflare deploy
      - id: upload
        run: |
          pnpm exec opennextjs-cloudflare upload -- --preview-alias pr-${{ github.event.pull_request.number }} --var SUPABASE_URL:https://crkeniidfajkqlnpacep.supabase.co --var SUPABASE_PUBLISHABLE_KEY:sb_publishable_s2VFJbusmfVQvcHJy5L7Kw_ZRpLHPxv --var SENTRY_ENVIRONMENT:preview --var SENTRY_RELEASE:${{ github.event.pull_request.head.sha }} --outdir dist 2>&1 | tee upload.log
          echo "url=$(grep -oE 'https://pr-[^ ]+workers\.dev' upload.log | head -1)" >> "$GITHUB_OUTPUT"
          echo "size=$(grep -oE 'Total Upload: .*' upload.log | head -1)" >> "$GITHUB_OUTPUT"
      - run: pnpm exec sentry-cli sourcemaps upload --org renan-m-software-house --project xicaflor --release ${{ github.event.pull_request.head.sha }} dist
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "**Preview:** ${{ steps.upload.outputs.url }}
          **Bundle:** ${{ steps.upload.outputs.size }} (limite do plano gratuito: 3 MiB gzip)
          Commit: ${{ github.event.pull_request.head.sha }}"
